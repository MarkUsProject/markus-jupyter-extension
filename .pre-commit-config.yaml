repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Runs the Prettier version pinned in jupyterlab-markus-extension/package.json,
  # so the hook, editors, and the command line all format identically. Requires
  # `pnpm install` in jupyterlab-markus-extension/ first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node jupyterlab-markus-extension/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        types: [text]
