[build-system]
requires = [
    "hatchling>=1.10.0",
    "hatch-nodejs-version>=0.3.2",
    "jupyter-builder>=1.2.0,<2",
]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-markus-extension"
version = "0.1.0"
description = "JupyterLab extension to submit notebooks to MarkUs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[dependency-groups]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.2.0"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_markus_extension/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
only-include = ["jupyterlab_markus_extension", "install.json"]

[tool.hatch.build.targets.wheel.sources]
"jupyterlab_markus_extension" = "jupyterlab_markus_extension"
"install.json" = "install.json"

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_markus_extension/labextension" = "share/jupyter/labextensions/jupyterlab-markus-extension"
"install.json" = "share/jupyter/labextensions/jupyterlab-markus-extension/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = [
    "hatch-jupyter-builder>=0.5",
]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_markus_extension/labextension/package.json"
]
skip-if-exists = ["jupyterlab_markus_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["pnpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build:prod"
npm = ["pnpm"]
source_dir = "src"
build_dir = "jupyterlab_markus_extension/labextension"
